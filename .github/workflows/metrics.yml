# Draft — copy to nsrvel/nsrvel/.github/workflows/metrics.yml if approved
# No extra secret needed: uses ${{ secrets.GITHUB_TOKEN }} (public data only).
# If a plugin needs private repos / more scope later, switch token to ${{ secrets.METRICS_TOKEN }} (classic PAT).
# Inspired by lowlighter/metrics examples: one step per SVG, base "" for plugin-only files, commit once at the end.
name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics.yml"
      - "README.md"
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Classic dashboard
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          output_action: none
          plugins_errors_fatal: no

      - name: Terminal dashboard
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.terminal.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          template: "@terminal"
          setup_community_templates: lowlighter/metrics@master:terminal+trust
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          output_action: none
          plugins_errors_fatal: no

      - name: Isometric commit calendar (full year)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Jakarta
          output_action: none
          plugins_errors_fatal: no

      - name: Languages in-depth
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.languages.indepth.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          output_action: none
          plugins_errors_fatal: no

      - name: Languages recently used
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.languages.recent.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: ""
          plugin_languages: yes
          plugin_languages_sections: recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          output_action: none
          plugins_errors_fatal: no

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          output_action: none
          plugins_errors_fatal: no

      - name: Coding habits
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.habits.charts.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: ""
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          config_timezone: Asia/Jakarta
          output_action: none
          plugins_errors_fatal: no

      - name: Recent activity
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          output_action: none
          plugins_errors_fatal: no

      - name: Lines changed
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.lines.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: repositories
          plugin_lines: yes
          output_action: none
          plugins_errors_fatal: no

      - name: Stargazers graph
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.stargazers.graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_charts_type: graph
          output_action: none
          plugins_errors_fatal: no

      - name: Skyline
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.skyline.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: ""
          plugin_skyline: yes
          output_action: none
          plugins_errors_fatal: no

      - name: Commit calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.calendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: ""
          plugin_calendar: yes
          output_action: none
          plugins_errors_fatal: no

      - name: Notable contributions
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.notable.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: ""
          plugin_notable: yes
          output_action: none
          plugins_errors_fatal: no

      - name: Pinned repositories
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.repositories.pinned.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 4
          output_action: none
          plugins_errors_fatal: no

      - name: Random code snippet
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.code.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nsrvel
          base: ""
          plugin_code: yes
          output_action: none
          plugins_errors_fatal: no

      - name: Commit metrics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add metrics*.svg
          git diff --cached --quiet || git commit -m "chore: update metrics"
          git push
